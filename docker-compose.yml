version: '3.9'

services:

  redis:
    image: redis:latest
    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

  productservice:
    build:
      context: .
      dockerfile: ProductService/Dockerfile

    container_name: productservice

    depends_on:
      - redis

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=ProductCatalogDB;User Id=sa;Password=Password@123;TrustServerCertificate=True;Encrypt=False"

      Redis__ConnectionString: "redis:6379"

    restart: unless-stopped

volumes:
  redis_data: