name: Product Catalog CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Build Docker Image
        run: docker build -t productcatalogapi -f ProductService/Dockerfile .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Tag Docker Image
        if: success()
        run: docker tag productcatalogapi ${{ secrets.DOCKER_USERNAME }}/productcatalogapi:latest

      - name: Push Docker Image
        if: success()
        run: docker push ${{ secrets.DOCKER_USERNAME }}/productcatalogapi:latest